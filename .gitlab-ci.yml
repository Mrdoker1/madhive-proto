workflow:
  name: MadHive build for $CI_COMMIT_BRANCH $CI_COMMIT_TAG $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /dev|main/
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - init
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  DOCKER_BUILDKIT: 1
  DEPLOY_HOST: 3.131.60.70

default:
  tags:
    - oxaid
  interruptible: true

init:
  stage: init
  image: alpine:3.22
  script:
    - apk add curl bash
    - curl --silent "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" | bash
    # Copy SSL certificate and key required for nginx https
    - cp .secure_files/oxagile* deploy/ssl
    - mkdir -p deploy/nginx && cp .secure_files/.htpasswd deploy/nginx/.htpasswd
    - echo WEB_IMAGE=${HARBOR_HOST}/${HARBOR_PROJECT}/madhive:${CI_COMMIT_REF_SLUG}-$(date +'%d-%m-%Y-%H-%M') >> build.env
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /dev|main/

build:
  stage: build
  image: docker:27
  variables:
    GIT_CLEAN_FLAGS: none
    CACHE_IMAGE: "${HARBOR_HOST}/${HARBOR_PROJECT}/madhive:cache"
  services:
    - name: docker:27-dind
      alias: docker
  before_script:
    - echo "$HARBOR_PASSWORD" | docker login $HARBOR_URL -u $HARBOR_USERNAME --password-stdin
    - docker buildx create --name container --driver docker-container --driver-opt default-load=true docker
    - docker buildx inspect container --bootstrap
  script:
    - |
      docker buildx build \
      --cache-from type=registry,ref=$CACHE_IMAGE \
      --cache-to type=registry,ref=$CACHE_IMAGE,mode=max \
      --tag $WEB_IMAGE \
      --push \
      --builder container \
      --output type=image .
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /dev|main/

deploy:
  stage: deploy
  image: docker:27
  variables:
    GIT_CLEAN_FLAGS: none
  services:
    - name: docker:27-dind
      alias: docker
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - chmod 400 "$AWS_SSH_PRIVATE_KEY"
    - ssh-add "$AWS_SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $DEPLOY_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - echo "$HARBOR_PASSWORD" | docker login $HARBOR_URL -u $HARBOR_USERNAME --password-stdin
  script:
    - docker pull $WEB_IMAGE
    - echo "WEB_IMAGE=$WEB_IMAGE"
    - docker save $WEB_IMAGE | gzip | ssh ubuntu@$DEPLOY_HOST 'gunzip | docker load'
    - docker context create remote --docker "host=ssh://ubuntu@$DEPLOY_HOST" || true
    - docker --context remote compose up -d
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /dev|main/

